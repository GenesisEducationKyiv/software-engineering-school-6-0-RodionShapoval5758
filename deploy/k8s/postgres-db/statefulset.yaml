apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-db
  labels:
    app.kubernetes.io/name: postgres-db
    app.kubernetes.io/part-of: github-release-notification
spec:
  serviceName: postgres-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-db
        app.kubernetes.io/part-of: github-release-notification
    spec:
      containers:
        - name: postgres-db
          image: postgres:16.9
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - configMapRef:
                name: postgres-db-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-db-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "github_release_notifications"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "github_release_notifications"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # No storageClassName: uses the cluster's default StorageClass.
        resources:
          requests:
            storage: 5Gi
