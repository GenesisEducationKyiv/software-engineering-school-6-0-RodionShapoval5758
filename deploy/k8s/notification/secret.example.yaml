# Copy to secret.yaml (gitignored), replace every CHANGE_ME, then apply that copy.
apiVersion: v1
kind: Secret
metadata:
  name: notification-secret
  labels:
    app.kubernetes.io/name: notification
    app.kubernetes.io/part-of: github-release-notification
type: Opaque
stringData:
  SMTP_USER: "CHANGE_ME"
  SMTP_PASSWORD: "CHANGE_ME"
