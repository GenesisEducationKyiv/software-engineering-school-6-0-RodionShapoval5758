apiVersion: apps/v1
kind: Deployment
metadata:
  name: subscription
  labels:
    app.kubernetes.io/name: subscription
    app.kubernetes.io/part-of: github-release-notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: subscription
  template:
    metadata:
      labels:
        app.kubernetes.io/name: subscription
        app.kubernetes.io/part-of: github-release-notification
    spec:
      containers:
        - name: subscription
          image: github-release-notification-subscription:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 50051
          envFrom:
            - configMapRef:
                name: subscription-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: subscription-secret
                  key: DATABASE_URL
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: subscription-secret
                  key: GITHUB_TOKEN
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          # /health pings Postgres and NATS, so liveness must not use it: a dependency outage would restart every pod.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: certs
          secret:
            secretName: subscription-secret
            # Without items, DATABASE_URL and GITHUB_TOKEN would also be written as files under /certs.
            items:
              - key: ca.crt
                path: ca.crt
              - key: subscription.crt
                path: subscription.crt
              - key: subscription.key
                path: subscription.key
