apiVersion: v1
kind: Service
metadata:
  # The name is load-bearing: the TLS cert SAN is DNS:subscription and callers dial subscription:50051.
  name: subscription
  labels:
    app.kubernetes.io/name: subscription
    app.kubernetes.io/part-of: github-release-notification
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: subscription
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 50051
      targetPort: grpc
