# Copy to secret.yaml (gitignored), replace every CHANGE_ME / <paste ...>, then apply that copy.
apiVersion: v1
kind: Secret
metadata:
  name: monitoring-secret
  labels:
    app.kubernetes.io/name: monitoring
    app.kubernetes.io/part-of: github-release-notification
type: Opaque
stringData:
  # Same Postgres instance/database as subscription; monitoring uses its own
  # migrations table (monitoring_schema_migrations) to avoid colliding with it.
  DATABASE_URL: "postgres://postgres:CHANGE_ME@postgres-db:5432/github_release_notifications?sslmode=disable"
  GITHUB_TOKEN: "CHANGE_ME"
  ca.crt: |
    <paste contents of certs/ca.crt>
  monitoring.crt: |
    <paste contents of certs/monitoring.crt>
  monitoring.key: |
    <paste contents of certs/monitoring.key>
