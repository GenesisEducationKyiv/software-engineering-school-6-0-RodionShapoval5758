apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/name: monitoring
    app.kubernetes.io/part-of: github-release-notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: monitoring
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monitoring
        app.kubernetes.io/part-of: github-release-notification
    spec:
      containers:
        - name: monitoring
          image: github-release-notification-monitoring:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: monitoring-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: monitoring-secret
                  key: DATABASE_URL
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: monitoring-secret
                  key: GITHUB_TOKEN
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: certs
          secret:
            secretName: monitoring-secret
            items:
              - key: ca.crt
                path: ca.crt
              - key: monitoring.crt
                path: monitoring.crt
              - key: monitoring.key
                path: monitoring.key
