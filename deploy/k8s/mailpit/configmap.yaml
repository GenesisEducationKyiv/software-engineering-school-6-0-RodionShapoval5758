apiVersion: v1
kind: ConfigMap
metadata:
  name: mailpit-config
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: github-release-notification
data:
  MP_MAX_MESSAGES: "5000"
  MP_SMTP_AUTH_ACCEPT_ANY: "1"
  MP_SMTP_AUTH_ALLOW_INSECURE: "1"
  # UI/API served under /mail so the Ingress can route it without a rewrite.
  MP_WEBROOT: "mail"
