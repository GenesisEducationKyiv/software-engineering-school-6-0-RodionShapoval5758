server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /metrics {
        return 404;
    }

    location /api/ {
        proxy_pass http://subscription:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # trailing slash strips the /auth prefix: /auth/login -> auth:8080/login
    location /auth/ {
        proxy_pass http://auth:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
