name: CI-Pipeline
on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'deploy/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'deploy/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Golang
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run unit tests
        run: task test-unit

  integration-test:
    needs: [unit-test, lint]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Golang
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run integration tests
        run: task test-integration

  e2e-test:
    needs: [unit-test, lint]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and dependencies
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Generate mTLS certs
        run: ./build/certs/gen.sh
      - name: Start stack
        run: API_KEY=test-api-key docker compose up -d --wait --build
      - name: Run e2e tests
        working-directory: frontend
        env:
          API_KEY: test-api-key
        run: npx playwright test
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7
      - name: Teardown stack
        if: always()
        run: docker compose down -v

  smoke-test:
    needs: [unit-test, lint]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - uses: grafana/setup-k6-action@v1
      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate mTLS certs
        run: task certs-gen
      - name: Start stack
        run: docker compose up -d --wait --build
      - name: Run smoke test
        run: task k6-smoke-ci
      - name: Teardown stack
        if: always()
        run: docker compose down -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Golang
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Lint services
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: >-
            --config=.golangci.yaml
            ./services/subscription/...
            ./services/monitoring/...
            ./services/notification/...
            ./services/auth/...
          working-directory: .

  publish:
    needs: [unit-test, lint, integration-test, e2e-test, smoke-test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [auth, subscription, monitoring, notification, nginx]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/github-release-notification-${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=raw,value=latest
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/${{ matrix.service }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
